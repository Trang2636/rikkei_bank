spring.application.name=IT211_RikkeiBank

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/rikkei_bank_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

app.upload-dir=uploads/kyc

jwt.secret=rikkei_bank_secret_key_256_bit_minimum_length_for_security_2026
jwt.access-token-expiration=300000
jwt.refresh-token-expiration=86400000